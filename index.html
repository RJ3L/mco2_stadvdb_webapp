<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transactions Management Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>

<body>
    <div class="container">
        <div class="title-frame"></div>
        <h1 class="title">TRANSACTIONS MANAGEMENT DASHBOARD</h1>

        <section class="node-status">
            <h2 class="node-status-title">Node Status</h2>
            
            <div class="node-grid">
                
                <div class="node1-box">
                    <div class="node1-rectangle"></div>
                    <div class="node1-button-bg"></div>
                    <div class="node1-label">Node 1</div>
                    <div class="node1-button">Button</div> 
                </div>
                
                <div class="node2-box">
                    <div class="node2-rectangle"></div>
                    <div class="node2-button-bg"></div>
                    <div class="node2-label">Node 2</div>
                    <div class="node2-button">Button</div> 
                </div>
                
                <div class="node3-box">
                    <div class="node3-rectangle"></div>
                    <div class="node3-button-bg"></div>
                    <div class="node3-label">Node 3</div>
                    <div class="node3-button">Button</div> 
                </div>

            </div>
        </section>
        <section class="terminal-frame" style="left: 50px; top: 290px;">
            <h3 class="terminal-header">Server 1</h3>
            <div class="terminal-screen">
                <iframe class="terminal-iframe" src="http://ccscloud.dlsu.edu.ph:60145" title="Server 0"></iframe>
            </div>
        </section>

        <section class="terminal-frame" style="left: 650px; top: 290px;">
            <h3 class="terminal-header">Server 2</h3>
            <div class="terminal-screen">
                <iframe class="terminal-iframe" src="http://ccscloud.dlsu.edu.ph:60146" title="Server 1"></iframe>
            </div>
        </section>

        <section class="terminal-frame" style="left: 350px; top: 650px;">
            <h3 class="terminal-header">Server 3</h3>
            <div class="terminal-screen">
                <iframe class="terminal-iframe" src="http://ccscloud.dlsu.edu.ph:60147" title="Server 2"></iframe>
            </div>
        </section>

        </div>
    
</body>
</html>
